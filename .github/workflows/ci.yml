name: "Continuous Integration"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-and-verify:
    name: "Strict Check, Native and Wasm Verification"
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install MoonBit Toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Check MoonBit Version
        run: |
          moon version --all

      - name: Format Check
        run: |
          moon fmt --check

      - name: Strict Wasm-Compatible Type Check
        run: |
          moon check --deny-warn

      - name: Strict Native Type Check
        run: |
          moon check --target native --deny-warn

      - name: Native Build
        run: |
          moon build --target native

      - name: Strict Native Automated Tests
        run: |
          moon test --target native --deny-warn

      - name: Validate Example Zone
        run: |
          moon run --target native cmd/moondns -- check -z examples/example.com.zone -o example.com.

      - name: Strict Wasm-Compatible Tests
        run: |
          moon test --deny-warn

      - name: WebAssembly Tests (moon test --target wasm)
        run: |
          moon test --target wasm

      - name: WebAssembly-GC Tests (moon test --target wasm-gc)
        run: |
          moon test --target wasm-gc

      - name: JavaScript Target Tests (moon test --target js)
        run: |
          moon test --target js

      - name: Build WebAssembly Binary
        run: |
          moon build --target wasm

      - name: Run Node.js WASI End-to-End Verification
        run: |
          node scripts/verify_wasm.js
